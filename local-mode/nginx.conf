events {}

http {
  server {
    listen 80;

    # Swagger UI and OpenAPI served by rs-server-frontend
    location = /docs {
      proxy_pass http://rs-server-frontend:8000/docs;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs/ {
      proxy_pass http://rs-server-frontend:8000/docs/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
      proxy_pass http://rs-server-frontend:8000/openapi.json;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route ADGS backend under /auxip
    location = /auxip {
      return 301 /auxip/;
    }

    location /auxip/ {
      proxy_pass http://rs-server-adgs:8000/auxip/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route CADIP backend under /cadip
    location = /cadip {
      return 301 /cadip/;
    }

    location /cadip/ {
      proxy_pass http://rs-server-cadip:8000/cadip/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route PRIP backend under /prip
    location = /prip {
      return 301 /prip/;
    }

    location /prip/ {
      proxy_pass http://rs-server-prip:8000/prip/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route Catalog backend under /catalog
    location = /catalog {
      return 301 /catalog/;
    }

    location /catalog/ {
      proxy_pass http://rs-server-catalog:8000/catalog/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /staging {
      return 301 /staging/;
    }

    location /staging/ {
      proxy_pass http://rs-server-staging:8000/staging/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dpr {
      return 301 /dpr/;
    }

    location /dpr/ {
      proxy_pass http://rs-dpr-service:8000/dpr/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dask/staging {
      return 301 /dask/staging/;
    }

    location /dask/staging/ {
      proxy_pass http://dask-staging:8000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dask/l0 {
      return 301 /dask/l0/;
    }

    location /dask/l0/ {
      proxy_pass http://dask-l0:8000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dask/eopf-mockup {
      return 301 /dask/eopf-mockup/;
    }

    location /dask/eopf-mockup/ {
      proxy_pass http://dask-eopf-mockup:8000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dask/s1ard {
      return 301 /dask/s1ard/;
    }

    location /dask/s1ard/ {
      proxy_pass http://dask-s1ard:8000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
