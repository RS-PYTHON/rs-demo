events {}

http {
  server {
    listen 80;

    # See: https://sandro-keil.de/blog/let-nginx-start-if-upstream-host-is-unavailable-or-down/
    # This is the internal Docker DNS, cache only for 30s
    resolver 127.0.0.11 valid=30s;

    # Swagger UI and OpenAPI served by rs-server-frontend
    location = /docs {
      proxy_pass http://rs-server-frontend:8000/docs;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs/ {
      proxy_pass http://rs-server-frontend:8000/docs/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
      proxy_pass http://rs-server-frontend:8000/openapi.json;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route ADGS backend under /auxip
    location = /auxip {
      return 301 /auxip/;
    }

    location /auxip/ {
      proxy_pass http://rs-server-adgs:8000/auxip/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route CADIP backend under /cadip
    location = /cadip {
      return 301 /cadip/;
    }

    location /cadip/ {
      proxy_pass http://rs-server-cadip:8000/cadip/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route PRIP backend under /prip
    location = /prip {
      return 301 /prip/;
    }

    location /prip/ {
      proxy_pass http://rs-server-prip:8000/prip/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route Catalog backend under /catalog
    location = /catalog {
      return 301 /catalog/;
    }

    location /catalog/ {
      proxy_pass http://rs-server-catalog:8000/catalog/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /staging {
      return 301 /staging/;
    }

    location /staging/ {
      proxy_pass http://rs-server-staging:8000/staging/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    ##################
    # rs-dpr-service #
    ##################

    # NOTE (Julien): I don't need location = /dpr {return 301 /dpr/;}

    # By default all requests go to rs-dpr-service_py3.11.7-2024.5.2
    location /dpr {

      # Don't use a trailing / so we forward the original request URI
      # See: https://oneuptime.com/blog/post/2025-12-16-fix-trailing-slash-nginx-proxy-pass/view
      proxy_pass http://rs-dpr-service_py3.11.7-2024.5.2:8000;

      # The service will redirect e.g. /dpr/processes/ into /dpr/processes (without the trailing /)
      # so we need 'proxy_set_header Host $http_host;' else the port disappears.
      # Found here: https://www.reddit.com/r/nginx/comments/uy0wlv/redirect_from_server_removes_port_bug_on_my/
      proxy_set_header Host $http_host;

      # Not sure if this is useful
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Requests to these processors go to rs-dpr-service_py3.11.7-2026.1.2
    location ~ /dpr/processes/(conv_safe_zarr|other-proc1) {
      proxy_pass http://rs-dpr-service_py3.11.7-2026.1.2:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Requests to these processors go to rs-dpr-service_py3.13.12-2026.1.2
    location ~ /dpr/processes/(s1_ard|other-proc2) {
      proxy_pass http://rs-dpr-service_py3.13.12-2026.1.2:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    ########
    # dask #
    ########

    location = /dask/staging {
      return 301 /dask/staging/;
    }

    location /dask/staging/ {
      proxy_pass http://dask-staging:8000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dask/l0 {
      return 301 /dask/l0/;
    }

    location /dask/l0/ {

      # This upstream is missing when we run from the ci/cd, so nginx will fail at startup.
      # We use a variable instead, so nginx will not check if the host is reachable on startup.
      # See: https://sandro-keil.de/blog/let-nginx-start-if-upstream-host-is-unavailable-or-down/
      set $upstream http://dask-l0:8000/;
      proxy_pass $upstream;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dask/eopf-mockup {
      return 301 /dask/eopf-mockup/;
    }

    location /dask/eopf-mockup/ {
      proxy_pass http://dask-eopf-mockup:8000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dask/s1ard {
      return 301 /dask/s1ard/;
    }

    location /dask/s1ard/ {

      # Use variable for missing upstream from the ci/cd.
      set $upstream http://dask-s1ard:8000/;
      proxy_pass $upstream;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dask/s3olci {
      return 301 /dask/s3olci/;
    }

    location /dask/s3olci/ {

      # Use variable for missing upstream from the ci/cd.
      set $upstream http://dask-s3olci:8000/;
      proxy_pass $upstream;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
