name: Run all demos

on:
  push:
  workflow_dispatch:

env:
  PYTHON_VERSION: 3.13.12
  DOCKER_REGISTRY: ghcr.io

jobs:
  build-env-external-data-sources:
    name: Build env for external data sources
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ case(github.event_name == 'pull_request', github.head_ref, '') }}
      - run: |
          set -x

          python local-mode/scripts/export_vars.py local-mode/config/rs-server.yaml
          while IFS= read -r line; do
            export "$line"
          done < local-mode/.env-external-data-sources

          # Commit the file if it changed
          to_commit=".env-external-data-sources"
          if [[ -n $(git status -s $to_commit) ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add $to_commit
            git commit -m "Updated env for external data sources"
            git push
          fi

  test:
    runs-on: ubuntu-latest
    name: Run all demos
    needs: build-env-external-data-sources
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pre-commit
        run: >
          echo
          ":information_source: This job checks that you have run \`pre-commit run --all-files\` in
          your local git repository before committing."
          >> $GITHUB_STEP_SUMMARY
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd

      - name: Log into Docker registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run all demos in local mode
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -x

          # For main or develop, use the :latest image tags
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "develop" ]]; then
            export DOCKER_TAG=latest

          # Else, replace special characters by -
          else
            export DOCKER_TAG=$(sed "s/[^a-zA-Z0-9]/-/g" <<< "$BRANCH_NAME")
          fi

          # Run all demos
          ./test-rs-demo.sh
        shell: bash
