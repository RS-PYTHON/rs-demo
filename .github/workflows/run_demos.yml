name: Run all demos

on:
  push:
  workflow_dispatch:
    inputs:
      dpr_image_tag:
        description: "Optional py3.13.16-2026.3.0 DPR image tag for bootstrap testing (e.g. latest-temp-cicd)"
        required: false
        default: ""
        type: string
      jupyter_image_tag:
        description: "Optional local-mode Jupyter image tag for bootstrap testing (e.g. latest-temp-cicd)"
        required: false
        default: ""
        type: string

env:
  DOCKER_REGISTRY: ghcr.io

jobs:
  build-env-external-data-sources:
    name: Build env for external data sources
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Checkout branch not pr (needed by git push)
          ref: ${{ case(github.event_name == 'pull_request', github.head_ref, '') }}
      - run: |
          set -x
          # This script creates .env-external-data-sources in local-mode/
          python local-mode/scripts/export_vars.py local-mode/config/rs-server.yaml

          # Commit the file if it changed
          to_commit="local-mode/.env-external-data-sources"
          if [[ -n $(git status -s $to_commit) ]]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add $to_commit
            git commit -m "Updated env for external data sources"
            git push
          fi

  test:
    runs-on: ubuntu-latest
    name: Run all demos
    needs: build-env-external-data-sources
    steps:
      - uses: actions/checkout@v6
        with:
          # Checkout branch not pr (so we get changes from build-env-external-data-sources)
          ref: ${{ case(github.event_name == 'pull_request', github.head_ref, '') }}
          submodules: true

      - name: Log into Docker registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Override DPR image for bootstrap testing
        if: github.event_name == 'workflow_dispatch' && inputs.dpr_image_tag != ''
        env:
          DPR_IMAGE_TAG: ${{ inputs.dpr_image_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$DPR_IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid DPR image tag"
            exit 1
          fi

          image="ghcr.io/rs-python/rs-dpr-service_py3.13.16-2026.3.0"
          docker manifest inspect "${image}:${DPR_IMAGE_TAG}" > /dev/null
          compose_file="local-mode/docker-compose.yml"
          grep -Fq "image: ${image}:latest" "$compose_file"
          sed -i "s|^\([[:space:]]*image: ghcr[.]io/rs-python/rs-dpr-service_py3[.]13[.]16-2026[.]3[.]0:\)latest$|\1${DPR_IMAGE_TAG}|" "$compose_file"
        shell: bash

      - name: Override Jupyter image for bootstrap testing
        if: github.event_name == 'workflow_dispatch' && inputs.jupyter_image_tag != ''
        env:
          JUPYTER_IMAGE_TAG: ${{ inputs.jupyter_image_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$JUPYTER_IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Jupyter image tag"
            exit 1
          fi

          image="ghcr.io/rs-python/jupyter/rs-client-libraries/local"
          docker manifest inspect "${image}:${JUPYTER_IMAGE_TAG}" > /dev/null
          compose_file="local-mode/docker-compose.yml"
          grep -Fq "image: ${image}:latest" "$compose_file"
          sed -i "s|^\([[:space:]]*image: ghcr[.]io/rs-python/jupyter/rs-client-libraries/local:\)latest$|\1${JUPYTER_IMAGE_TAG}|" "$compose_file"
        shell: bash

      - name: Run all demos in local mode
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -x

          # For main or develop, use the :latest image tags
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "develop" ]]; then
            export DOCKER_TAG=latest

          # Else, replace special characters by -
          else
            export DOCKER_TAG=$(sed "s/[^a-zA-Z0-9]/-/g" <<< "$BRANCH_NAME")
          fi

          # Run all demos
          ./test-rs-demo.sh
        shell: bash

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notebook-outputs
          path: local-mode/notebook-outputs/
          if-no-files-found: ignore

  trigger-rs-workflow-env:
    runs-on: ubuntu-latest
    name: Trigger rs-workflow-env # to build the jupyter image for cluster mode with the latest rs-demo changes
    if: (github.event_name == 'push') && (github.ref_name == 'develop') # Only when we push to develop
    steps:
      - name: Trigger rs-workflow-env
        # Link to the URL of this current github actions run
        env:
          THIS_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        uses: benc-uk/workflow-dispatch@ba9b031f598534deb29873396ef7b0acf17aa94a
        with:
          workflow: build-jupyter.yml
          repo: RS-PYTHON/rs-workflow-env
          ref: develop
          inputs: '{
            "build_base_image": false,
            "caller_name": "rs-demo",
            "caller_url": "${{ env.THIS_URL }}",
            "caller_reason": "Build the Jupyter image for cluster mode with the latest rs-demo."
            }'
          token: '${{ secrets.TRIGGER_WORKFLOWS }}'
          wait-for-completion: true
          wait-timeout-seconds: 3600
          sync-status: true
