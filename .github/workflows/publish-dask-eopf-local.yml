name: Docker for dask-gateway-server + eopf/dpr

# Run workflow only on manual trigger
on:
  workflow_dispatch:
    inputs:
      DASK_GATEWAY_TAG:
        description: dask-gateway-server tag (version)
        default: 2024.1.0
      PREFECT_TAG:
        description: prefect tag (vesion)
        default: 3.1.4

env:
  PYTHON_VERSION: 3.11.7
  DOCKER_REGISTRY: ghcr.io

jobs:
  main:
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      docker_image: ${{ steps.publish-docker.outputs.docker_image}}
    steps:
      - uses: actions/checkout@v4
      - id: publish-docker
        uses: ./.github/actions/publish-docker
        with:
          dockerfile: ./local-mode/docker/Dockerfile.dask-eopf-local
          build_context_path: ./local-mode/docker
          image_basename: "${{ github.repository_owner }}/dask-gateway-server"
          image_suffix: /eopf/local
          version_name: latest
          dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_args: |
            DASK_GATEWAY_TAG=${{ inputs.DASK_GATEWAY_TAG }}
            PREFECT_TAG=${{ inputs.PREFECT_TAG }}
          secrets: |
            EOPF_TOKEN=${{ secrets.GITLAB_EOPF_TOKEN }}
