# Generic metadata about this project
name: sprint19-rs-client
prefect-version: 3

pull:
- prefect.deployments.steps.run_shell_script:
    # Download source code from S3 bucket using the prefect block named "s3".
    # NOTE: we cannot use comments or break long lines, most of bash features don't work...
    expand_env_vars: true
    script: |
        python -c "from prefect_aws import S3Bucket; S3Bucket.load('$PREFECT_SHARE_BUCKET').get_directory('$S3_CODE_FOLDER', '.')"

deployments:
- name: sprint19-rs-client
  tags: ["demo"]
  entrypoint: ./rs_client_flow.py:get_staging_jobs
  # schedules:
  #   - cron: "0 * * * *"
  #     timezone: "Europe/London"
  #     active: true
  # flow_name: sprint19-rs-client
  work_pool:
    name: "{{ PREFECT_WORK_POOL_STAGING }}"
    job_variables:
        env:
            # Copy env vars from client environment
            S3_CODE_FOLDER: "{{ S3_CODE_FOLDER }}"
            PREFECT_SHARE_BUCKET: "{{ PREFECT_SHARE_BUCKET }}"
            RSPY_LOCAL_MODE: "{{ RSPY_LOCAL_MODE }}"
            RS_SERVER_STAGING_ADDRESS: "{{ RS_SERVER_STAGING_ADDRESS }}"
            RS_API_KEY: "{{ RS_API_KEY }}"
            RS_OWNER: "{{ RS_OWNER }}"
