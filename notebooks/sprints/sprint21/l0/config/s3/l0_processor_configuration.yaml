      - true
      - false
      - false
      - false
      - true
      - false
      - true

    sequence_description:
      S01:
        id: 101
        sequence: S01
        triggers: RAC
        description: "RADIOMETRIC CALIBRATION"
      S02:
        id: 102
        sequence: S02
        triggers: NONE
        description: "SPECTRAL CALIBRATION with DIFF1 at ORBIT N"
      S03:
        id: 103
        sequence: S03
        triggers: SPC
        description: "SPECTRAL CALIBRATION with DIFF3 at ORBIT N+1"
      S04:
        id: 104
        sequence: S04
        triggers: RAC
        description: "DIFFUSER1 AGEING at ORBIT N"
      S05:
        id: 105
        sequence: S05
        triggers: RAC
