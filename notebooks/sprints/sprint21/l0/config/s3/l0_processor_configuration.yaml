  # -------------------------------------------------------------
  # 12. Merge and Consolidation Configuration
  # -------------------------------------------------------------
  merge_and_consolidation:
    # OLCI
    olci:
      # Activated
      enabled: true
      # Minimum length of a tolorated granule in seconds
      min_granule_length: 16
      # Maximum distance between granules to be merged in seconds
      max_merge_distance: 360
      # Seasonnal Effect Gap in secondes
      seasonnal_effect_gap: 2700
    # SLSTR
    slstr:
      # Activated
      enabled: true
      # Minimum length of a tolorated granule in seconds
      min_granule_length: 155
      # Maximum distance between granules to be merged in seconds
      max_merge_distance: 900
    # SRAL
    sral:
      # Activated
      enabled: true
      # Minimum length of a tolorated granule in seconds
      min_granule_length: 16
      # Maximum distance between granules to be merged in seconds
      max_merge_distance: 1200

  # -------------------------------------------------------------
  # 13. Quality Control Parameters
  # -------------------------------------------------------------
  quality_check:
    # Activated
    check_crc: true
    check_gaps: true
    # Maximim threashold of errors allowed
    max_format_errors: 1
