general_configuration:
  logging:
    level: DEBUG
  # setup a basic logging configuration
  triggering__use_basic_logging: true
  # Wait before stopping the dask cluster, usefull for localCluster to access the dashboard
  triggering__wait_before_exit: 10
  # Export the dask graph for variables at writing time
  dask__export_graphs: ./reports/graphs
   # breakpoints: activate intermediate data dump
   # WRITE mode : write the entire outputs EOProducts of the ProcessingUnit in the zarr associated storage
   # FORCE_WRITE mode : Same as WRITE but overload existing breakpoint
   # RETRIEVE mode: replace the computed output of the ProcessingUnit by a disc read product
   # SKIP mode: do nothing

workflow:
- name: s3_l0_processor
  # Activate or not this unit, if not active its outputs will not be available
  active : true
  # python module to import from
  module: l0.s3.s3_l0_processor
  processing_unit: S3L0Processor
  # input products IDs
  inputs:
    CADUS: S3ACADUS

  outputs:
    doris_dop:
      DORDOP

I/O:
  # input products descriptions and access parameters
  input_products:
  - id: S3ACADUS
    path: s3://${S3_BUCKET_NAME}/stations/CADIP/S3B_20240411142312031054
    store_type: cadu
    store_params:
      storage_options:
        key: ${S3_ACCESSKEY}
        secret: ${S3_SECRETKEY}
        client_kwargs:
          endpoint_url: ${S3_ENDPOINT}
          region_name: ${S3_REGION}
      storage_options_local_mode: # in local mode, use the cluster s3 bucket
        key: ${S3_ACCESSKEY_K8S}
        secret: ${S3_SECRETKEY_K8S}
        client_kwargs:
          endpoint_url: ${S3_ENDPOINT_K8S}
          region_name: ${S3_REGION_K8S}

  output_products:
  - id: DORDOP
    path: ${OUTPUT_DIR}/S3B_20240411142312031054
    type: folder
    store_type: zarr
    opening_mode: "CREATE_OVERWRITE"
    store_params:
      storage_options:
        key: ${S3_ACCESSKEY}
        secret: ${S3_SECRETKEY}
        client_kwargs:
          endpoint_url: ${S3_ENDPOINT}
          region_name: ${S3_REGION}

# Dask context configuration, see eopf.daskconfig.dask_context_manager
dask_context:
  cluster_type: gateway
  cluster_config:
    address: ${DASK_GATEWAY_EOPF_ADDRESS}
    reuse_cluster: ${DASK_CLUSTER_EOPF_NAME}
    auth:
      type: jupyterhub
      api_token: ${JUPYTERHUB_API_TOKEN}
    auth_local_mode: # auth for local mode
      type: basic
      username: ${LOCAL_DASK_USERNAME}
      password: ${LOCAL_DASK_PASSWORD}

  # Activate the report file writing in this file
  performance_report_file: ./reports/report.html

# Any logging file(s) to load to the EOLogging facility
logging: "../logging_config.yaml"
# Any config file(s) to load to the EOConfiguration facility, general_configuration and env variables will overload them
config:
  - "./l0_processor_configuration.yaml"
