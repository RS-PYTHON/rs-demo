general_configuration:
  logging:
    level: INFO
  # setup a basic logging configuration
  triggering__use_basic_logging: true
  triggering__use_default_filename: false
  # Wait before stopping the dask cluster, usefull for localCluster to access the dashboard
  triggering__wait_before_exit: 0
  # Export the dask graph for variables at writing time
  dask__export_graphs: ./reports/graphs

workflow:
- name: s1_l0_processor
  # Activate or not this unit, if not active its outputs will not be available
  active: true
  # python module to import from
  module: l0.s1.s1_l0_processor
  processing_unit: S1L0Processor
  # input products IDs
  inputs:
    CADUS: S1ACADU
  outputs:
    datatakeid_.*: output_folder

  adfs:
    osf: OSF
    fro: FRO
    # session_info: SSI

  parameters:
    acquisition_report_output_path: ./output_params/s1
    streaming_mode: false
    temporary_path: ./output_params/tmp


io:
  # input products descriptions and access parameters
  input_products:

  - id: S1ACADU
    path: s3://${PREFECT_BUCKET_NAME}/stations/CADIP/test-l0-develop/S1A_20250611050700059594.short
    engine: cadu
    reader_params:
      # s3_secret_alias: s3_cluster # see secrets.json
      storage_options:
        key: ${S3_ACCESSKEY_CLUSTER}
        secret: ${S3_SECRETKEY_CLUSTER}
        client_kwargs:
          endpoint_url: ${S3_ENDPOINT_CLUSTER}
          region_name: ${S3_REGION_CLUSTER}

  adfs:

  - id: OSF
    path : s3://${PREFECT_BUCKET_NAME}/stations/ADGS/test-l0-develop/unzip/S1A_OPER_MPL_ORBSCT_20140507T150704_99999999T999999_0027.EOF
    adf_params:
      # s3_secret_alias: s3_cluster # see secrets.json
      storage_options:
        key: ${S3_ACCESSKEY_CLUSTER}
        secret: ${S3_SECRETKEY_CLUSTER}
        client_kwargs:
          endpoint_url: ${S3_ENDPOINT_CLUSTER}
          region_name: ${S3_REGION_CLUSTER}

  - id: FRO
    path : s3://${PREFECT_BUCKET_NAME}/stations/ADGS/test-l0-develop/unzip/S1A_OPER_MPL_ORBPRE_20250612T021934_20250619T021933_0001.EOF
    adf_params:
      # s3_secret_alias: s3_cluster # see secrets.json
      storage_options:
        key: ${S3_ACCESSKEY_CLUSTER}
        secret: ${S3_SECRETKEY_CLUSTER}
        client_kwargs:
          endpoint_url: ${S3_ENDPOINT_CLUSTER}
          region_name: ${S3_REGION_CLUSTER}

  # - id: SSI
  #   path : s3://${PREFECT_BUCKET_NAME}/stations/CADIP/test-l0-develop/S1A_20250611050700059594.short/DCS_04_S1A_20250611050700059594_ch1_DSIB.xml
  #   adf_params:
  #     # s3_secret_alias: s3_cluster # see secrets.json
  #     storage_options:
  #       key: ${S3_ACCESSKEY_CLUSTER}
  #       secret: ${S3_SECRETKEY_CLUSTER}
  #       client_kwargs:
  #         endpoint_url: ${S3_ENDPOINT_CLUSTER}
  #         region_name: ${S3_REGION_CLUSTER}


  output_products:
  - id: output_folder
    path: ${OUTPUT_DIR}/S1A_20240410083700053369.short
    # Type can be file or folder, in case of folder the product naming will depends on the triggering__use_default_filename EOConfiguration
    type: folder
    # The engine to use
    engine: cpm_zarr
    # Any access parameters
    writer_params:
      # s3_secret_alias: s3_local_or_cluster # see secrets.json
      storage_options:
        key: ${S3_ACCESSKEY}
        secret: ${S3_SECRETKEY}
        client_kwargs:
          endpoint_url: ${S3_ENDPOINT}
          region_name: ${S3_REGION}
      mode: "w"

# Dask context configuration, see eopf.dask_utils.dask_context_manager
context_managers:
- module: eopf.dask_utils.dask_context_manager
  context_manager: DaskContext
  parameters:
    cluster_type: gateway
    cluster_config:
      address: ${DASK_GATEWAY_ADDRESS}
      reuse_cluster: ${DASK_CLUSTER_INSTANCE}
      auth:
        type: jupyterhub
        api_token: ${JUPYTERHUB_API_TOKEN}
      auth_local_mode: # auth for local mode
        type: basic
        username: ${LOCAL_DASK_USERNAME}
        password: ${LOCAL_DASK_PASSWORD}

    # Activate the report file writing in this file
    performance_report_file: ./reports/report.html

# Any secret files to be loaded in the secrets dictionary of EOConfiguration
secret:
  - ../secrets.json

# Any config file(s) to load to the EOConfiguration facility, general_configuration and env variables will overload them
config:
- ./iw_configuration.yaml
- ../cadu_configuration.yaml
