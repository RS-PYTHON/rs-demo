general_configuration:
  logging:
    level: DEBUG
  # setup a basic logging configuration
  triggering__use_basic_logging: true
  # Wait before stopping the dask cluster, usefull for localCluster to access the dashboard
  triggering__wait_before_exit: 10
  triggering__use_default_filename: false

workflow:
- name: s1_l0_processor
  # Activate or not this unit, if not active its outputs will not be available
  active : true
  # python module to import from
  module: l0.s1.s1_l0_processor
  processing_unit: S1L0Processor
  # input products IDs
  inputs:
    CADUS: S1CADUS

  outputs:
    .*: output_folder

  adfs:
    osf: OSF
    fro: FRO

  parameters:
    streaming_mode: false
    temporary_path: ./tmp
    acquisition_report_output_path: ./S1_D_TDS_01/Zarr/S1_D_TDS_01/report/

I/O:

  input_products:
  - id: S1CADUS
    path: ./S1_D_TDS_01/CADUs_full
    store_type: cadu

  adfs:
  - id: OSF
    path: ./S1_D_TDS_01/AUX/S1A_OPER_MPL_ORBSCT_20140507T150704_99999999T999999_0026.EOF

  - id: FRO
    path: ./S1_D_TDS_01/AUX/S1A_OPER_MPL_ORBPRE_20240404T021403_20240411T021403_0001.EOF

  output_products:
  - id: output_folder
    path: "./S1_D_TDS_01/Zarr/full"

    type: folder
    opening_mode: "CREATE_OVERWRITE"
    store_type: zarr

# Dask context configuration, see eopf.daskconfig.dask_context_manager
dask_context:
  cluster_type: local
  cluster_config:
    n_workers: 4
    threads_per_worker: 1
    memory_limit: 20GiB
  client_config: { timeout: 320s }
  # Activate the report file writing in this file
  performance_report_file: dask_report.html
# Any logging file(s) to load to the EOLogging facility
logging: ./S1_D_TDS_01/logging_config.yaml
# Any config file(s) to load to the EOConfiguration facility, general_configuration and env variables will overload them
config:
  - "./S1_D_TDS_01/l0_s1_processor_configuration.yaml"
  - "./S1_D_TDS_01/l0_dask_configuration.yaml"
