prefect-version: 3
name: sprint20-dpr-example

pull:
- prefect.deployments.steps.run_shell_script:
    # Download source code from S3 bucket using the prefect block named "s3".
    # NOTE: we cannot use comments or break long lines, most of bash features don't work...
    expand_env_vars: true
    script: |
        python -c "from prefect_aws import S3Bucket; S3Bucket.load('$PREFECT_BLOCK_S3').get_directory('users/jovyan/code', '.')"

deployments:
- name: sprint20-dpr-example
  tags: ["demo"]
  entrypoint: ./dpr_processor_example.py:dpr_flow
  work_pool:
    name: "{{ PREFECT_WORK_POOL }}"
    job_variables:
        env:
            HELLO_FROM: "prefect"
            # Copy env vars from client environment
            PREFECT_BLOCK_AUTH: "{{ PREFECT_BLOCK_AUTH }}"
            PREFECT_BLOCK_S3: "{{ PREFECT_BLOCK_S3 }}"
            DASK_GATEWAY_ADDRESS: "{{ DASK_GATEWAY_ADDRESS }}"
            DASK_CLUSTER_NAME: "{{ DASK_CLUSTER_NAME }}"
            RSPY_LOCAL_MODE: "{{ RSPY_LOCAL_MODE }}"
            S3_ACCESSKEY: "{{ S3_ACCESSKEY }}"
            S3_SECRETKEY: "{{ S3_SECRETKEY }}"
            S3_ENDPOINT: "{{ S3_ENDPOINT }}"
            S3_REGION: "{{ S3_REGION }}"
