prefect-version: 3

pull:
- prefect.deployments.steps.git_clone:
    repository: https://github.com/RS-PYTHON/rs-client-libraries.git
    branch: s1-ard-julien #develop # should be 'develop' in git

definitions:
    work_pools:
        my_work_pool: &my_work_pool
            name: "{{ PREFECT_WORK_POOL_EOPF }}"

deployments:
- name: On-demand processing
  tags: ["demo", "sprint 24"]
  entrypoint: ./rs_workflows/on_demand_processing.py:on_demand_processing
  work_pool: *my_work_pool

- name: Auxip search
  tags: ["demo", "sprint 24"]
  entrypoint: ./rs_workflows/auxip_flow.py:search
  work_pool: *my_work_pool

- name: Cadip search
  tags: ["demo", "sprint 24"]
  entrypoint: ./rs_workflows/cadip_flow.py:search
  work_pool: *my_work_pool

- name: Staging
  tags: ["demo", "sprint 24"]
  entrypoint: ./rs_workflows/staging_flow.py:staging
  work_pool: *my_work_pool
