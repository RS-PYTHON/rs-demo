prefect-version: 3
name: sprint23-s3l0-demo-processor

pull:
- prefect.deployments.steps.run_shell_script:
    # Download source code from S3 bucket using the prefect block named "s3".
    # NOTE: we cannot use comments or break long lines, most of bash features don't work...
    expand_env_vars: true
    script: |
        python -c "from prefect_aws import S3Bucket; S3Bucket.load('$PREFECT_SHARE_BUCKET').get_directory('$S3_CODE_FOLDER', '.')"

deployments:
- name: sprint23-s3l0-demo-processor
  tags: ["demo"]
  entrypoint: ./s3l0_demo_processor_with_dpr_service.py:s3l0_demo_processor
  work_pool:
    name: "{{ PREFECT_WORK_POOL_EOPF }}"
    job_variables:
        env:
            # Copy env vars from client environment
            OWNER_ID: "{{ OWNER_ID }}"
            S3_CODE_FOLDER: "{{ S3_CODE_FOLDER }}"
            # TODO: should rather be set in the deployment helm charts
            RSPY_WEBSITE: "{{ RSPY_WEBSITE }}"
            RSPY_UAC_CHECK_URL: "{{ RSPY_UAC_CHECK_URL }}"
            TEMPO_ENDPOINT: "{{ TEMPO_ENDPOINT }}"
            OTEL_PYTHON_REQUESTS_TRACE_HEADERS: "{{ OTEL_PYTHON_REQUESTS_TRACE_HEADERS }}"
            OTEL_PYTHON_REQUESTS_TRACE_BODY: "{{ OTEL_PYTHON_REQUESTS_TRACE_BODY }}"
            RSPY_DPR_SERVICE_ADDRESS: "{{ RSPY_DPR_SERVICE_ADDRESS }}"
