prefect-version: 3
name: tuto-deploy-yaml-s3

pull:
- prefect.deployments.steps.run_shell_script:
    # Download source code and wheels from S3 bucket using the prefect block named "s3".
    # Install the downloaded wheels.
    # NOTE: we cannot use comments or break long lines, most of bash features don't work...
    expand_env_vars: true
    script: |
        python -c "from prefect_aws import S3Bucket; S3Bucket.load('$PREFECT_BLOCK_S3').get_directory('$S3_CODE_FOLDER', '.')"
        pip install emoji --find-links ./wheels

deployments:
- name: tuto-deploy-yaml-s3
  tags: ["tutorial"]
  entrypoint: ./my_prefect.py:flow_show_stars
  work_pool:
    name: "{{ PREFECT_WORK_POOL }}"
    job_variables:
        env:
            HELLO_FROM: "prefect"
            # Copy env vars from client environment
            S3_CODE_FOLDER: "{{ S3_CODE_FOLDER }}"
            PREFECT_BLOCK_S3: "{{ PREFECT_BLOCK_S3 }}"
